    put:
      operationId: putToolSecret
      summary: >-
        Forwarded internally to PUT /internal/v1/tools/{id}/secret; never persisted on
        the PHP side. The `auth_mode: "service"` counterpart to putConnectionSecret.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionSecretInput' }
      responses:
        "204": { description: Stored }
  /tools/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: testTool
      summary: >-
        Proves a `kind: http` tool's configured URL is reachable past the egress allowlist
        (PRD §6.5/§7.4) — attaches the stored `auth_mode: service` secret if one exists,
        see ai-internal.yaml's testTool.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }

