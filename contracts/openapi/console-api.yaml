      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvalRun' } } } } } }
    post:
      operationId: createEvalRun
      summary: 'Creates a runtime.eval_runs row and enqueues real execution via POST /internal/v1/evals (ai-internal.yaml).'
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CreateEvalRunInput' } } } }
      responses:
