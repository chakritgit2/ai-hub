        counting + console.model_pricing lookup.
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EvalCostEstimateInput' } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvalCostEstimate' } } } }
        "404": { description: 'dataset_id or agent_version_id not found for this company' }
        "422": { description: 'agent_version_id resolved but its current spec failed to compile' }
