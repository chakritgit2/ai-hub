      summary: 'Compares two eval runs'' summary.mean_scores side by side (PRD §6.7) - reads runtime.eval_runs directly, no ai-runtime call.'
      parameters:
        - { $ref: '#/components/parameters/XCompanyId' }
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvalRunComparison' } } } }
