openapi: 3.0.3
info:
  title: Dynamiq Console API
  description: >
    Control-plane API served by console-api (Phalcon). PRD-001 §9.1.
    Every /admin/v1/* route except /me and /companies requires the X-Company-Id header.
  version: "0.1.0"
servers:
  - url: /admin/v1
security:
  - ssoJwt: []
components:
  securitySchemes:
    ssoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: SSO JWT issued by the existing Phalcon system (RS256 + JWKS), PRD §7.1/7.6.
  parameters:
    XCompanyId:
      name: X-Company-Id
      in: header
      required: true
      schema:
        type: string
      description: Company context for this request; checked against membership (PRD §7.2).
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotImplemented:
      description: Not implemented yet (skeleton stub).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_implemented
  schemas:
    Placeholder:
      type: object
      description: Placeholder body for a not-yet-designed (phase 2/3) endpoint.
      additionalProperties: true
    Company:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        external_ref: { type: string }
        status: { type: string, enum: [active, suspended] }
        monthly_budget_usd: { type: number }
    Me:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        is_platform_admin: { type: boolean }
        companies:
          type: array
          items:
            type: object
            properties:
              company_id: { type: string }
              role: { type: string, enum: [admin, developer, viewer] }
    RuntimeTokenResponse:
      type: object
      properties:
        token: { type: string }
        expires_in: { type: integer, example: 300 }
    Connection:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        type: { type: string, example: dynamiq.connections.OpenAI }
        api_base: { type: string }
        masked_hint: { type: string }
        max_concurrency: { type: integer }
    ConnectionSecretInput:
      type: object
      required: [secret]
      properties:
        secret: { type: string }
    Tool:
      type: object
      description: >-
        CRUD + standalone connectivity test only (PRD §6.5) — not yet wired into the agent
        spec/compiler, so no agent can call one during a run.
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [http, builtin, python] }
        access_level: { type: string, enum: [read, write] }
        auth_mode: { type: string, enum: [service, delegated] }
        audience: { type: string, nullable: true }
        config:
          type: object
          additionalProperties: true
          description: 'kind-specific: for http, url/method/headers/description/input_schema.'
        enabled: { type: boolean }
    SkillVersion:
      type: object
      properties:
        id: { type: string }
        version_no: { type: integer }
        content: { type: string, description: 'SKILL.md content, max 100 KB (PRD §6.6a).' }
        content_hash: { type: string }
        has_scripts: { type: boolean }
        is_published: { type: boolean }
        published_at: { type: string, nullable: true }
    Skill:
      type: object
      description: >-
        CRUD + versioning only (PRD §6.6a) — not yet wired into the agent spec/compiler, so
        no agent can load one via SkillsTool during a run.
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        latest_version: { $ref: '#/components/schemas/SkillVersion' }
    SkillInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        content: { type: string, description: 'Creating a new draft, or editing an already-published one, bumps the version.' }
    KnowledgeBase:
      type: object
      description: >-
        OKF knowledge base (PRD §6.6). Vector-only retrieval this round -
        retrieval_mode: hybrid is accepted but rejected (422) at index/search time
        until hybrid retrieval ships.
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        embedder_connection_id: { type: string, description: 'Must belong to the same company.' }
        chunk_size: { type: integer, example: 800 }
        chunk_overlap: { type: integer, example: 100 }
        retrieval_mode: { type: string, enum: [vector, hybrid] }
        alpha: { type: number, format: float, example: 0.6 }
        okf_field_map:
          type: object
          additionalProperties: true
          description: 'Remaps OKF frontmatter field names, e.g. {"id": "doc_id"} (PRD §6.6).'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KnowledgeBaseInput:
      type: object
      properties:
        name: { type: string }
        embedder_connection_id: { type: string }
        chunk_size: { type: integer }
        chunk_overlap: { type: integer }
        retrieval_mode: { type: string, enum: [vector, hybrid] }
        alpha: { type: number, format: float }
        okf_field_map: { type: object, additionalProperties: true }
    KbImportResultItem:
      type: object
      properties:
        document_id: { type: string }
        path: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed] }
    KbDocument:
      type: object
      properties:
        id: { type: string }
        path: { type: string }
        category: { type: string, nullable: true }
        status: { type: string, enum: [queued, processing, ready, failed] }
        chunk_count: { type: integer }
        error: { type: string, nullable: true }
    KbSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        top_k: { type: integer, default: 5 }
    KbSearchResultItem:
      type: object
      properties:
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        score: { type: number, format: float, nullable: true }
    KbSearchResult:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/KbSearchResultItem' }
    Agent:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        archived_at: { type: string, format: date-time, nullable: true }
    AgentVersion:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        agent_id: { type: string }
        version_no: { type: integer }
        spec: { type: object, additionalProperties: true }
        spec_version: { type: string }
        compiled_definition: { type: object, additionalProperties: true, nullable: true }
        compiler_version: { type: string, nullable: true }
        dynamiq_version: { type: string, nullable: true }
        is_published: { type: boolean }
        published_by: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
    Deployment:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        slug: { type: string }
        environment: { type: string, enum: [staging, production] }
        agent_version_id: { type: string }
        rate_limit_per_min: { type: integer }
        daily_token_limit: { type: integer }
        daily_cost_limit_usd: { type: number }
        allowed_origins: { type: array, items: { type: string } }
        guardrail_overrides: { type: object, additionalProperties: true }
        output_mode: { type: string, enum: [stream, buffered] }
        allow_write_tools: { type: boolean }
        conversation_ttl_days: { type: integer }
        config_version: { type: integer }
        enabled: { type: boolean }
    ApiKey:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        prefix: { type: string, example: ak_advws_ }
        allowed_ips: { type: array, items: { type: string } }
        rate_limit_per_min: { type: integer }
        daily_cost_limit_usd: { type: number }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        revoked_at: { type: string, format: date-time, nullable: true }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              description: Full key value, shown once.
    Run:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        agent_version_id: { type: string }
        deployment_id: { type: string, nullable: true }
        conversation_id: { type: string, nullable: true }
        source: { type: string, enum: [playground, api, eval] }
        status: { type: string, enum: [success, error, blocked, interrupted, truncated, cancelled] }
        agent_name: { type: string }
        model: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
    DashboardSummary:
      type: object
      properties:
        runs_today: { type: integer }
        tokens_this_month: { type: object, properties: { in: { type: integer }, out: { type: integer } } }
        cost_this_month_usd: { type: number }
        error_rate: { type: number }
        guardrail_triggers: { type: integer }
    RunConversation:
      type: object
      description: Metadata only (PRD §6.9) - message content lives in runtime.agent_memory, a separate, larger piece of work.
      properties:
        id: { type: string }
        deployment_id: { type: string, nullable: true }
        source: { type: string }
        external_user_id: { type: string, description: Hashed, not the raw identifier (PRD §7.4). }
        last_message_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    GuardrailEvent:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string, nullable: true }
        stage: { type: string, enum: [input, output] }
        check: { type: string }
        action: { type: string, enum: [block, mask, flag] }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    EgressAllowlistEntry:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        host_pattern: { type: string }
        port: { type: integer, nullable: true }
        allow_private_ip: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        is_platform_admin: { type: boolean }
        role: { type: string, enum: [admin, developer, viewer] }
paths:
  /me:
    get:
      operationId: getMe
      summary: Current user, their companies and roles.
      security: [{ ssoJwt: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /runtime-token:
    post:
      operationId: issueRuntimeToken
      summary: Issue a 5-minute Playground runtime JWT (PRD §4.4-B, §7.6).
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_version_id]
              properties:
                agent_version_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeTokenResponse' }

  /connections:
    get:
      operationId: listConnections
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Connection' } }
    post:
      operationId: createConnection
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connection' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
  /connections/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getConnection
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
    patch:
      operationId: updateConnection
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connection' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
    delete:
      operationId: deleteConnection
      responses:
        "204": { description: Deleted }
  /connections/{id}/secret:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    put:
      operationId: putConnectionSecret
      summary: Forwarded internally to PUT /internal/v1/connections/{id}/secret; never persisted on the PHP side (PRD §7.4).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionSecretInput' }
      responses:
        "204": { description: Stored }
  /connections/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: testConnection
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }

  /agents:
    get:
      operationId: listAgents
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Agent' } } } } }
    post:
      operationId: createAgent
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getAgent
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
    patch:
      operationId: updateAgent
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}/clone:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: cloneAgent
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: archiveAgent
      summary: Soft-deletes an agent (sets status=archived, archived_at=now()) — there is no hard delete for agents.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}/unarchive:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: unarchiveAgent
      summary: Reverses archiveAgent (clears status back to draft, archived_at to null).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: exportAgent
      x-phase: 3
      responses:
        "200": { description: OK, content: { application/yaml: { schema: { type: string } } } }
  /agents/{id}/import:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: importAgent
      x-phase: 3
      requestBody:
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
  /agents/{id}/versions:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: listAgentVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgentVersion' } } } } }
    post:
      operationId: createAgentVersion
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentVersion' }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AgentVersion' } } } }
  /agents/{id}/versions/{vid}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
      - { name: vid, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAgentVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentVersion' } } } }
    patch:
      operationId: updateAgentVersion
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentVersion' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentVersion' } } } }
  /agents/{id}/versions/{vid}/publish:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
      - { name: vid, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishAgentVersion
      summary: Recompiles via ai-runtime, sets is_published=true, bumps dependent deployments' config_version (PRD §4.4-A).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentVersion' } } } }

  /deployments:
    get:
      operationId: listDeployments
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deployment' } } } } }
    post:
      operationId: createDeployment
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Deployment' }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
  /deployments/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getDeployment
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
    patch:
      operationId: updateDeployment
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Deployment' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
    delete:
      operationId: deleteDeployment
      responses:
        "204": { description: Deleted }
  /deployments/{id}/promote:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: promoteDeployment
      x-phase: 3
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }

  /api-keys:
    get:
      operationId: listApiKeys
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } } } }
    post:
      operationId: createApiKey
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKey' }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyCreated' } } } }
  /api-keys/{id}/revoke:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: revokeApiKey
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiKey' } } } }

  /runs:
    get:
      operationId: listRuns
      parameters:
        - { $ref: '#/components/parameters/XCompanyId' }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: deployment_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Run' } } } } }
  /runs/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}/conversation:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getRunConversation
      summary: Conversation metadata the run belongs to (not message content - that lives in runtime.agent_memory, out of scope here).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunConversation' } } } }
  /runs/{id}/guardrail-events:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: listRunGuardrailEvents
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GuardrailEvent' } } } } }

  /dashboard:
    get:
      operationId: getDashboardSummary
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }

  /tools:
    get:
      operationId: listTools
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tool' } } } } } }
    post:
      operationId: createTool
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Tool' } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Tool' } } } } }
  /tools/{id}:
