openapi: 3.0.3
info:
  title: Dynamiq AI Public & Playground API
  description: >
    Two path groups served from the same ai-runtime/ai-gateway image (PRD-001 §4.2, §9.3-9.4):
    /ai/v1/* is the Playground API on ai-runtime (port 8080, runtime-token auth);
    /v1/deployments/* is the public gateway API on ai-gateway (API key / session token auth).
  version: "0.1.0"
components:
  securitySchemes:
    runtimeToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 5-minute JWT issued by console-api POST /admin/v1/runtime-token.
    gatewayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Company gateway API key, prefix ak_{company_code}_ (PRD §7.7). Server-to-server only."
    sessionToken:
      type: http
      scheme: bearer
      description: 5-minute browser session token issued by POST /v1/deployments/{slug}/session.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: "Deployment slug, <company_code>-<name>."
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Placeholder:
      type: object
      additionalProperties: true
    Approval:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_id: { type: string }
        request: { type: object, additionalProperties: true, description: The pending tool-call payload. }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DecideApprovalInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
    RunRequest:
      type: object
      required: [input]
      properties:
        input: { type: string }
        conversation_id: { type: string, nullable: true, description: Omit to start a new conversation. }
        user:
          type: object
          nullable: true
          description: Server-to-server only — end-user identity to propagate to delegated tools (PRD §7.5).
          properties:
            external_id: { type: string }
            claims: { type: object, additionalProperties: true }
    RunResult:
      type: object
      properties:
        conversation_id: { type: string }
        output: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        trace_id: { type: string }
    WorkflowRunRequest:
      type: object
      required: [input]
      properties:
        input: { type: string }
    WorkflowRunResult:
      type: object
      properties:
        output: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        trace_id: { type: string }
    SessionRequest:
      type: object
      properties:
        external_user_id: { type: string }
        claims: { type: object, additionalProperties: true }
    SessionResponse:
      type: object
      properties:
        session_token: { type: string }
        expires_in: { type: integer, example: 300 }
    DeploymentInfo:
      type: object
      properties:
        display_name: { type: string }
        role: { type: string }
        languages:
          type: array
          items: { type: string }
    Jwks:
      type: object
      properties:
        keys:
          type: array
          items: { type: object, additionalProperties: true }
paths:
  /ai/v1/playground/run:
    post:
      operationId: runPlayground
      summary: Run a given agent version synchronously (PRD §4.4-B).
      security: [{ runtimeToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }

  /ai/v1/playground/run-workflow:
    post:
      operationId: runPlaygroundWorkflow
      summary: Run a given workflow version synchronously (PRD §6.9, phase 4, slice 2). No streaming, no conversation memory yet.
      security: [{ runtimeToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowRunRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRunResult' }

  /ai/v1/playground/stream:
    post:
      operationId: runPlaygroundStream
      summary: >
        Run a given agent version over SSE. Events: run_started ({"run_id"}, fires first -
        PRD Goal #6, the id to call POST /ai/v1/runs/{id}/cancel with), token,
        step (thought/tool_call/tool_result), guardrail, approval_required (write-tool call
        awaiting human decision, PRD §6.5 - {"approval_id", "tool"}), final, cancelled
        ({"run_id", "trace_id"}, in place of final when cancelRun was called in time),
        error, usage; heartbeat every 15s (PRD §6.2).
      security: [{ runtimeToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /ai/v1/runs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/IdParam' }]
    post:
      operationId: cancelRun
      summary: >-
        "Stop generating" for a live Playground run (PRD Goal #6) - signals the run's
        dynamiq CancellationToken (app.services.run_registry). Cooperative, not a hard
        interrupt, same caveat as the eval runs' own POST /evals/{id}/cancel. A run that
        was never active on this process (already finished, never existed, or belongs to
        a different company/agent version than this token's) is indistinguishable from an
        unknown id (PRD §12).
      security: [{ runtimeToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [cancel_requested] } }
        "404": { description: 'not an active run for this token''s company/agent version' }

  /v1/deployments/{slug}/run:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    options:
      operationId: runDeploymentCorsPreflight
      summary: >-
        Real CORS preflight for a session-token/browser caller of this route (PRD Goal #6)
        - unauthenticated by design (a preflight never carries Authorization), checks only
        Origin against the deployment's own allowed_origins. See /stream and /info's own
        options entries - all three share one handler (app.main_gateway).
      security: []
      responses:
        "204": { description: 'No Content - Access-Control-Allow-Origin present only when Origin is allowed' }
    post:
      operationId: runDeployment
      summary: >-
        Server-to-server synchronous run (PRD §4.4-C). Runs the agent or workflow version
        the deployment targets; a workflow-targeting deployment rejects a non-null
        conversation_id with 400 (no conversation memory for workflow runs yet).
      security: [{ gatewayApiKey: [] }, { sessionToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }

  /v1/deployments/{slug}/stream:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    options:
      operationId: streamDeploymentCorsPreflight
      summary: Real CORS preflight for this route - see /run's options entry for the shared shape.
      security: []
      responses:
        "204": { description: 'No Content - Access-Control-Allow-Origin present only when Origin is allowed' }
    post:
      operationId: streamDeployment
      summary: >-
        SSE run, from a server or directly from an end-user browser using a session token
        (PRD §4.4-C). Events: token (answer text, incremental), step (tool_call/tool_result,
        with sources when the tool is a web-search type like Tavily/Exa), approval_required
        (write-tool call awaiting human decision, PRD §6.5 - {"approval_id", "tool"}, up to
        a 5-minute wait), final, error. Agent-backed deployments only - a workflow-backed
        deployment returns 501 here (use the synchronous /run instead); QuotaExceededError
        and an upstream run failure are both delivered as an error event, not an HTTP
        status, since the stream has already started by the time either can be detected.
      security: [{ gatewayApiKey: [] }, { sessionToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /v1/deployments/{slug}/session:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    post:
      operationId: createDeploymentSession
      summary: Issue a 5-minute browser session token embedding end-user identity (PRD §7.5).
      security: [{ gatewayApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }

  /v1/deployments/{slug}/info:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    options:
      operationId: getDeploymentInfoCorsPreflight
      summary: Real CORS preflight for this route - see /run's options entry for the shared shape.
      security: []
      responses:
        "204": { description: 'No Content - Access-Control-Allow-Origin present only when Origin is allowed' }
    get:
      operationId: getDeploymentInfo
      summary: >-
        display_name, role, languages only — never instructions (PRD §6.1a). For a
        workflow-targeting deployment, display_name is the workflow's own name,
        role is the literal "workflow", and languages is empty.
      security: [{ gatewayApiKey: [] }, { sessionToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentInfo' }

  /v1/deployments/{slug}/approvals/{id}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: decideApproval
      summary: Approve/reject a write tool call from the calling app (PRD §6.5).
      security: [{ gatewayApiKey: [] }, { sessionToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideApprovalInput' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        "404": { description: no such approval for this deployment }
        "409": { description: approval already decided }

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Public keys for verifying delegated identity tokens (PRD §7.5/7.6). No auth.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
