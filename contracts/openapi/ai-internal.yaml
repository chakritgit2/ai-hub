openapi: 3.0.3
info:
  title: Dynamiq AI Internal API
  description: >
    Internal API served by ai-runtime on port 8081, reachable only from console-api pods
    (NetworkPolicy). PRD-001 §9.2. Auth: 60-second JWT signed by console-api (aud=ai-internal)
    + X-Company-Id + traceparent (PRD §7.1/7.6).
  version: "0.1.0"
servers:
  - url: /internal/v1
security:
  - internalJwt: []
components:
  securitySchemes:
    internalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed by console-api, aud=ai-internal, 60s lifetime.
  parameters:
    XCompanyId:
      name: X-Company-Id
      in: header
      required: true
      schema: { type: string }
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Placeholder:
      type: object
      additionalProperties: true
    Approval:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_id: { type: string }
        request: { type: object, additionalProperties: true, description: The pending tool-call payload. }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    DecideApprovalRequest:
      type: object
      required: [decision, decided_by]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        decided_by:
          type: string
          description: The console user's id - the internal JWT itself carries no user identity.
    EstimateEvalCostRequest:
      type: object
      required: [agent_version_id, dataset_id, metrics, judge_model, role]
      properties:
        agent_version_id: { type: string }
        dataset_id: { type: string }
        metrics:
          type: array
          items: { type: string }
          description: >-
            Canonical names (ai/app/services/eval_runner.py's METRIC_LLM_CALLS_PER_ITEM):
            faithfulness, context_recall, context_precision, answer_correctness,
            factual_correctness, bleu, rouge, exact_match, string_presence,
            string_similarity, llm_evaluator, python_evaluator. An unrecognized name is
            ignored with a warning, not rejected.
        judge_model: { type: string, description: 'May be empty if no chosen metric needs an LLM judge.' }
        role: { type: string, description: 'The caller''s company role - compiles the agent version the same way a real run would.' }
    EvalCostEstimate:
      type: object
      properties:
        item_count: { type: integer }
        agent_model: { type: string }
        judge_model: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              metric: { type: string }
              llm_calls_per_item: { type: integer }
        estimated_tokens:
          type: object
          properties:
            agent_input: { type: integer }
            agent_output: { type: integer }
            judge_input: { type: integer }
            judge_output: { type: integer }
        estimated_cost_usd:
          type: object
          properties:
            agent: { type: number, format: float, nullable: true }
            judge: { type: number, format: float, nullable: true }
            total: { type: number, format: float, nullable: true }
        warnings:
          type: array
          items: { type: string }
          description: 'e.g. an unrecognized metric name, or no console.model_pricing row for a model.'
    CreateEvalRunRequest:
      type: object
      required: [agent_version_id, dataset_id, metrics, role]
      properties:
        agent_version_id: { type: string }
        dataset_id: { type: string }
        metrics:
          type: array
          items: { type: string }
          minItems: 1
          description: >-
            Same canonical names as EstimateEvalCostRequest.metrics, minus llm_evaluator/
            python_evaluator - console-api rejects those with 422 before this call ever
            happens (not executable yet, see eval_runner.py's module docstring).
        judge_model: { type: string, nullable: true }
        role: { type: string }
        est_cost_usd: { type: number, format: float, nullable: true }
    EvalRun:
      type: object
      properties:
        id: { type: string }
        agent_version_id: { type: string }
        dataset_id: { type: string }
        role: { type: string }
        metrics:
          type: array
          items: { type: string }
        judge_model: { type: string, nullable: true }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        est_cost_usd: { type: number, format: float, nullable: true }
    KbImportFile:
      type: object
      required: [filename, content]
      properties:
        category: { type: string, nullable: true, description: 'Zip folder path, if any.' }
        filename: { type: string }
        content: { type: string, description: 'Raw OKF markdown content.' }
    KbImportResultItem:
      type: object
      properties:
        document_id: { type: string }
        path: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed] }
    KbDocumentItem:
      type: object
      properties:
        id: { type: string }
        path: { type: string }
        category: { type: string, nullable: true }
        status: { type: string, enum: [queued, processing, ready, failed] }
        chunk_count: { type: integer }
        error: { type: string, nullable: true }
    KbSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        top_k: { type: integer, default: 5 }
    KbSearchResultItem:
      type: object
      properties:
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        score: { type: number, format: float, nullable: true }
    KbSearchResult:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/KbSearchResultItem' }
    CompileRequest:
      type: object
      required: [spec, role]
      properties:
        spec: { type: object, additionalProperties: true, description: Agent spec JSON (PRD §6.1). }
        role: { type: string, enum: [admin, developer, viewer], description: Publisher role — gates the node-type allowlist. }
    CompileResult:
      type: object
      properties:
        ok: { type: boolean }
        compiled_definition: { type: object, additionalProperties: true, nullable: true }
        compiler_version: { type: string, nullable: true }
        dynamiq_version: { type: string, nullable: true }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
    CompileWorkflowRequest:
      type: object
      required: [spec, role]
      properties:
        spec: { type: object, additionalProperties: true, description: Workflow spec JSON (PRD §6.9, phase 4). }
        role: { type: string, enum: [admin, developer, viewer], description: Publisher role — gates the node-type allowlist. }
    RecompileAllResult:
      type: object
      properties:
        recompiled: { type: integer }
        failed:
          type: array
          items:
            type: object
            properties:
              agent_version_id: { type: string }
              error: { type: string }
    TestResult:
      type: object
      properties:
        ok: { type: boolean }
        detail: { type: string }
        models:
          type: array
          items: { type: string }
          description: Only populated by GET /connections/{id}/models.
    DeploymentUsage:
      type: object
      properties:
        rate_limit_per_min: { type: integer }
        requests_this_minute: { type: integer }
        daily_token_limit: { type: integer, nullable: true }
        tokens_today: { type: integer }
        daily_cost_limit_usd: { type: number, nullable: true }
        cost_today_usd: { type: number }
        reset_at: { type: string, format: date-time }
        redis_unavailable: { type: boolean }
paths:
  /agents/compile:
    post:
      operationId: compileAgentSpec
      summary: Validate spec + role-based node-type allowlist, compile to a Dynamiq definition (PRD §4.4-A, §6.1).
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileResult' }

  /agents/recompile-all:
    post:
      operationId: recompileAllAgents
      summary: Recompile every published version after a Dynamiq/compiler upgrade (PRD §12).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecompileAllResult' }

  /workflows/compile:
    post:
      operationId: compileWorkflowSpec
      summary: Validate spec + role-based node-type allowlist, compile to a GraphOrchestrator definition (PRD §6.9, phase 4). No execution - compile/validate only.
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileWorkflowRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileResult' }

  /connections/{id}/secret:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    put:
      operationId: putConnectionSecret
      summary: Envelope-encrypt with the company's DEK into runtime.connection_secrets (PRD §7.4/7.7).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        "204": { description: Stored }
    delete:
      operationId: deleteConnectionSecret
      summary: >-
        Cleans up runtime.connection_secrets for a connection being deleted - called by
        console-api after it has already deleted the console.connections row (best-effort,
        never re-resolves the connection). A no-op if no secret was ever stored.
      responses:
        "204": { description: Deleted (or nothing was stored) }

  /connections/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: testConnection
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }

  /connections/{id}/models:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: listConnectionModels
      summary: >-
        Real client.models.list() call against the connection's own provider - backs the
        agent editor Model tab's live model dropdown, never a hardcoded/static list.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }

  /deployments/{id}/usage:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: getDeploymentUsage
      summary: >-
        Read-only snapshot of the gateway's own Redis rate-limit/quota counters -
        backs the console's Deployment detail page "Usage" section. Never increments
        anything, so viewing it can't itself trip a limit.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentUsage' }

  /connections/{id}/test-model:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: testConnectionModel
      summary: >-
        Real, minimal (max_tokens=1) chat completion against one specific model string -
        proves that exact model actually works for chat, which listing alone can't.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }

  /tools/{id}/secret:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    put:
      operationId: putToolSecret
      summary: >-
        Envelope-encrypt with the company's DEK into runtime.tool_secrets - the
        `auth_mode: "service"` counterpart to PUT /connections/{id}/secret above.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        "204": { description: Stored }
    delete:
      operationId: deleteToolSecret
      summary: >-
        Cleans up runtime.tool_secrets for a tool being deleted - the auth_mode: "service"
        counterpart to DELETE /connections/{id}/secret above.
      responses:
        "204": { description: Deleted (or nothing was stored) }

  /tools/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: testTool
      summary: >-
        Checks a `kind: http` tool's configured url against the egress allowlist and makes
        one real request via SafeHttpClient to prove it's reachable (PRD §6.5/§7.4).
        `auth_mode: "service"` tools attach whatever secret is stored in
        runtime.tool_secrets, if any (fail-open: no stored secret is not a test failure).
        `kind: builtin`/`kind: python` return ok:false (no reachability story for either yet).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }

  /kb/{id}/documents:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: listKbDocuments
      x-phase: 2
      summary: Backs the Knowledge Bases detail page's document list/status panel.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KbDocumentItem' } } } } }
    post:
      operationId: enqueueKbDocumentIndexing
      x-phase: 2
      summary: >-
        Stores each uploaded OKF file on disk and enqueues indexing (PRD §6.6).
        Skips re-indexing a file whose content is unchanged from what's already stored
        for that (kb, okf_id). Vector-only retrieval this round — PDF/DOCX/TXT→OKF
        conversion and Thai tokenization/hybrid retrieval are not implemented yet.
      requestBody:
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/KbImportFile' } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KbImportResultItem' } } } } }

  /kb/{id}/search:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: searchKnowledgeBase
      x-phase: 2
      summary: Vector-only retrieval this round — 422 if the KB's retrieval_mode is hybrid.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KbSearchRequest' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KbSearchResult' } } } }

  /kb/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    get:
      operationId: exportKnowledgeBase
      x-phase: 2
      responses:
        "200": { description: OK, content: { application/zip: { schema: { type: string, format: binary } } } }

  /kb/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    delete:
      operationId: deleteKnowledgeBaseData
      x-phase: 2
      summary: Deletes the KB's stored objects, its pgvector table, and its kb_documents rows.
      responses:
        "204": { description: No Content }

  /evals/estimate:
    post:
      operationId: estimateEvalCost
      summary: >-
        Rough pre-run token/cost estimate (PRD §6.7) - real token counting via tiktoken
        against the dataset's own item text, priced against console.model_pricing. See
        ai/app/services/eval_runner.py's module docstring for exactly what's measured vs.
        a fixed approximation.
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EstimateEvalCostRequest' } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvalCostEstimate' } } } }
        "404": { description: 'dataset_id not found for this company' }
        "422": { description: 'agent_version_id not found or failed to compile' }

  /evals:
    post:
      operationId: createEvalRun
      summary: >-
        Creates a runtime.eval_runs row (status="queued") and enqueues `run_eval` onto
        ai-worker's ARQ queue (PRD §6.7) - see ai/app/services/eval_runner.py's module
        docstring for which metrics actually execute.
      parameters: [{ $ref: '#/components/parameters/XCompanyId' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CreateEvalRunRequest' } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EvalRun' } } } }
        "404": { description: 'dataset_id or agent_version_id not found for this company' }
        "422": { description: 'agent_version_id failed to compile, or metrics contains llm_evaluator/python_evaluator' }

  /evals/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: cancelEvalRun
      summary: >-
        Flips a queued/running eval run to "cancelled" (PRD §6.7). Cooperative, not a hard
        interrupt - see ai/app/services/eval_runner.py's run_eval docstring for exactly
        how far this reaches once a job has started.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvalRun' } } } }
        "404": { description: no such eval run for this company }
        "409": { description: eval run already completed or failed }

  /approvals/{id}:
    parameters:
      - { $ref: '#/components/parameters/XCompanyId' }
      - { $ref: '#/components/parameters/IdParam' }
    post:
      operationId: decideApproval
      summary: Approve/reject a write tool call from the console (PRD §6.5).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DecideApprovalRequest' } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        "404": { description: no such approval for this company }
        "409": { description: approval already decided }
