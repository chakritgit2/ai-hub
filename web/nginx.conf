# Serves the SvelteKit static SPA and proxies the API under the same origin, so the
# browser never needs CORS — same pattern as operations-advws's deploy/nginx/configmap.yaml.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/v1/ {
        proxy_pass http://console-api/admin/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
