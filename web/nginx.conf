# Serves the SvelteKit static SPA and proxies the API under the same origin, so the
# browser never needs CORS — same pattern as operations-advws's deploy/nginx/configmap.yaml.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/v1/ {
        proxy_pass http://console-api/admin/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Playground SSE stream (PRD §9.3) - the browser calls ai-runtime directly, never
    # through console-api (see web/src/lib/api/runtimeStream.ts). proxy_buffering must stay
    # off or nginx holds the whole response until ai-runtime closes it, defeating the
    # token-by-token stream; proxy_read_timeout is raised past the default 60s since a
    # Playground run can legitimately take longer than that between chunks.
    location /ai/v1/ {
        proxy_pass http://ai-runtime/ai/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
