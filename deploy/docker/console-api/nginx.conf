# Placeholder nginx config fronting php-fpm for console-api. PRD-001 §11.
server {
    listen 8000;
    root /app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # /healthz, /readyz, /metrics exist on every service but are never exposed via ingress (PRD §9.4).
}
