# First production rollout (non-HA scope-down from PRD-001 §11, approved by the user):
# dedicated namespace ai-hub-advws (created fresh by infra, NOT shared with
# operations-advws's cdi-advws namespace — see deploy/k8s/HANDOFF.md for the
# cross-namespace implications this has for operations-advws reaching ai-gateway),
# single-replica Postgres/Redis, ai-worker/MinIO deferred (Knowledge Bases only),
# fake-sso.php as a temporary SSO stand-in. See deploy/k8s/base/*.yaml comments and the
# session plan for the full rationale.
#
# operations-advws itself deploys plain manifests directly (no kustomize in that repo) —
# these resources can equally be applied with `kubectl apply -f deploy/k8s/base/` if that
# turns out to match the team's existing Jenkins convention better than `kubectl apply -k`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-hub-advws

resources:
  - secrets.example.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - ai-config.yaml
  - ai-runtime-deployment.yaml
  - ai-gateway-deployment.yaml
  - console-api-deployment.yaml
  - web-deployment.yaml
  - fake-sso-deployment.yaml

# Deferred: ai-worker (arq, Knowledge Bases only), MinIO, NetworkPolicy, Ingress/TLS/WAF,
# HPA — none are needed for the first "get chat working" rollout. See the plan for why.
