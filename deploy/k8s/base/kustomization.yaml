# First production rollout (non-HA scope-down from PRD-001 §11, approved by the user):
# dedicated namespace ai-hub-advws (created fresh by infra, NOT shared with
# operations-advws's cdi-advws namespace — see deploy/k8s/HANDOFF.md for the
# cross-namespace implications this has for operations-advws reaching ai-gateway),
# single-replica Postgres/Redis, Knowledge Bases' OKF files on a plain PVC (no MinIO —
# see ai-runtime-deployment.yaml), ai-worker now deployed too (see ai-worker-deployment.yaml
# — the ARQ consumer for KB indexing/evals/conversation cleanup), fake-sso.php as a
# temporary SSO stand-in. See deploy/k8s/base/*.yaml comments and the session plan for
# the full rationale.
#
# operations-advws itself deploys plain manifests directly (no kustomize in that repo) —
# these resources can equally be applied with `kubectl apply -f deploy/k8s/base/` if that
# turns out to match the team's existing Jenkins convention better than `kubectl apply -k`.
#
# DO NOT add secrets.example.yaml here. It documents real Secrets with literal
# "TODO-generate" placeholder values (see that file's own header) - applying it for real
# would overwrite the actual in-cluster Secrets (dynamiq-db-credentials, CONSOLE_MASTER_KEY,
# JWT keys, ...) with those placeholders. `kubectl apply -k deploy/k8s/base/` is therefore
# unsafe against a live namespace that already has real Secrets in it; apply individual
# files instead (`kubectl apply -f deploy/k8s/base/<file>.yaml`), the way infra's own
# tempo-infra-k8s-notes.md runbook does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-hub-advws

resources:
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - tempo-deployment.yaml
  - ai-config.yaml
  - ai-runtime-deployment.yaml
  - ai-worker-deployment.yaml
  - ai-gateway-deployment.yaml
  - console-api-deployment.yaml
  - web-deployment.yaml
  - fake-sso-deployment.yaml

# Deferred: NetworkPolicy, Ingress/TLS/WAF, HPA — none are needed for the first
# "get chat working" rollout. See the plan for why.
