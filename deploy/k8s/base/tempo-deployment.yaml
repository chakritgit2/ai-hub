# Single-binary Grafana Tempo — OTLP trace backend for ai/app/core/otel.py's OpenLIT
# tracing (gated behind OTEL_EXPORTER_OTLP_ENDPOINT in ai-config.yaml's ConfigMap, which
# points here). Local-disk storage, same non-HA scope-down as postgres/redis in this
# namespace — not shared with other apps in cdi-advws, this is ai-hub-advws's own instance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ai-hub-advws
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 10s

    compactor:
      compaction:
        block_retention: 336h # 14 days

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ai-hub-advws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      # Tempo's image runs as uid/gid 10001 ("tempo") by default; the PVC's volume is
      # otherwise mounted root-owned and the container can't write /var/tempo.
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.8.3
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: tempo-api
              containerPort: 3200
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: storage
              mountPath: /var/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: storage
          persistentVolumeClaim:
            claimName: tempo-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-storage
  namespace: ai-hub-advws
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ai-hub-advws
spec:
  selector:
    app: tempo
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: tempo-api
      port: 3200
      targetPort: 3200
