# Single-binary Grafana Tempo — OTLP trace backend for ai/app/core/otel.py's OpenLIT
# tracing (gated behind OTEL_EXPORTER_OTLP_ENDPOINT in ai-config.yaml's ConfigMap, which
# points here). Local-disk storage, same non-HA scope-down as postgres/redis in this
# namespace — not shared with other apps in cdi-advws, this is ai-hub-advws's own instance.
#
# Viewed from the shared Grafana in ns/monitoring via a Tempo datasource (added through the
# Grafana UI, not provisioning — see deploy/grafana/README.md):
#   http://tempo.ai-hub-advws.svc.cluster.local:3200
#
# This file mirrors what infra actually applied (tempo-infra-k8s-notes.md, 2026-11-03) -
# storageClassName: local-storage because this cluster has NO dynamic PV provisioner (all
# StorageClasses are kubernetes.io/no-provisioner); the matching PersistentVolume is
# cluster-scoped and node-specific (ai-hub-advws-tempo-pv, pinned via nodeAffinity to the
# node that has /mnt/tempo-ai-hub prepared), so infra keeps it out of this app repo's
# kustomize base entirely - apply this file on its own, not via `kubectl apply -k
# deploy/k8s/base/` (see kustomization.yaml's own warning about secrets.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ai-hub-advws
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    # Do not send anonymous usage stats to Grafana Labs from production
    usage_report:
      reporting_enabled: false

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 10s

    compactor:
      compaction:
        block_retention: 336h # 14 days

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ai-hub-advws
spec:
  replicas: 1
  # RWO PVC: the old pod must release the volume before the new one starts, otherwise a
  # rollout can hang on Multi-Attach if the new pod lands on another node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      # Tempo's image runs as uid/gid 10001 ("tempo") by default; the PVC's volume is
      # otherwise mounted root-owned and the container can't write /var/tempo.
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.8.3
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          env:
            # Soft memory target for the Go GC, kept below the container limit
            - name: GOMEMLIMIT
              value: "900MiB"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: tempo-api
              containerPort: 3200
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: storage
              mountPath: /var/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
          # TCP check only: /ready can stay 503 briefly after start (ingester ring
          # warm-up), which must not trigger restarts.
          livenessProbe:
            tcpSocket:
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: storage
          persistentVolumeClaim:
            claimName: tempo-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-storage
  namespace: ai-hub-advws
spec:
  accessModes: ["ReadWriteOnce"]
  # Cluster has no dynamic provisioner: binds to the static local PV ai-hub-advws-tempo-pv,
  # applied separately by infra (cluster-scoped, pins a node name - not in this repo).
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ai-hub-advws
spec:
  selector:
    app: tempo
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: tempo-api
      port: 3200
      targetPort: 3200
