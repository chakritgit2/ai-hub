# NOT real values — documents every Secret this deployment needs and how to generate it.
# Create the real ones directly in-cluster once kubectl access is restored, e.g.:
#   kubectl -n ai-hub-advws create secret generic dynamiq-db-credentials \
#     --from-literal=db_owner_password="$(openssl rand -base64 32)" \
#     --from-literal=console_app_password="$(openssl rand -base64 32)" \
#     --from-literal=console_platform_password="$(openssl rand -base64 32)" \
#     --from-literal=ai_app_password="$(openssl rand -base64 32)" \
#     --from-literal=gateway_app_password="$(openssl rand -base64 32)" \
#     --from-literal=postgres_superuser_password="$(openssl rand -base64 32)"
# Never commit this file with real values filled in — it exists only as a reference.

apiVersion: v1
kind: Secret
metadata:
  name: dynamiq-db-credentials
  namespace: ai-hub-advws
type: Opaque
stringData:
  db_owner_password: "TODO-generate"
  console_app_password: "TODO-generate"
  console_platform_password: "TODO-generate"
  ai_app_password: "TODO-generate"
  gateway_app_password: "TODO-generate"
  postgres_superuser_password: "TODO-generate"
  # Full asyncpg DSNs — ai-runtime/ai-gateway read DATABASE_URL as one string
  # (app.core.config.Settings), so the password is embedded here rather than
  # built from parts in the Deployment env (k8s env vars can't concatenate).
  ai_app_database_url: "postgresql+asyncpg://ai_app:TODO-generate@postgres:5432/ai_console"
  gateway_app_database_url: "postgresql+asyncpg://gateway_app:TODO-generate@postgres:5432/ai_console"

---
# CONSOLE_MASTER_KEY: python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
# HASH_PEPPER: openssl rand -base64 32
# SSH_PASSWORD: openssl rand -base64 24 — shared root password for console-api/ai/web's sshd
# (each service's bin/start.sh), used for SFTP access straight into the running pod
# (kubectl port-forward + .vscode/sftp.json).
apiVersion: v1
kind: Secret
metadata:
  name: dynamiq-console-secrets
  namespace: ai-hub-advws
type: Opaque
stringData:
  CONSOLE_MASTER_KEY: "TODO-generate"
  HASH_PEPPER: "TODO-generate"
  SSH_PASSWORD: "TODO-generate"

---
# Two fresh RS256 keypairs, mounted as files (the code expects file paths, not inline PEM
# env vars — see console-api/bin/generate-jwt-key.php and
# ai/app/services/gateway_auth.py's _load_or_create_key).
#   console-api's signing key: php console-api/bin/generate-jwt-key.php (or any RS256 keygen)
#   the gateway's own key:     openssl genrsa -out gateway-key.pem 2048
apiVersion: v1
kind: Secret
metadata:
  name: dynamiq-jwt-keys
  namespace: ai-hub-advws
type: Opaque
stringData:
  console-signing-key.pem: |
    TODO-generate-and-paste-real-PEM
  gateway-key.pem: |
    TODO-generate-and-paste-real-PEM
