# ai-runtime: /internal/v1/* (compile/publish, connection test/secret, KB indexing/search).
# Same image as ai-gateway, different command/port (deploy/docker/ai/Dockerfile's own TODO).
# KB OKF files live on the `kb-storage` PVC mounted below (app.core.storage,
# KB_STORAGE_ROOT) — previously MinIO, switched to a plain volume (no extra licensed
# service, see deploy/k8s/HANDOFF.md). Not mounted on ai-gateway: KB storage is only ever
# read/written from ai-runtime's internal API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: ai-hub-advws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-runtime
  template:
    metadata:
      labels:
        app: ai-runtime
    spec:
      imagePullSecrets:
        - name: dockersecret
      containers:
        - name: ai
          image: cr.advws.com/dynamiq-console/ai:TODO-tag
          # args, not command: the image's ENTRYPOINT (bin/start.sh) must still run so it
          # can bring up sshd before handing off to this uvicorn invocation (exec "$@").
          args: ["uv", "run", "uvicorn", "app.main_runtime:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
            # sshd (bin/start.sh) — SFTP access into the running pod, not exposed via Service.
            - name: sftp
              containerPort: 2222
          envFrom:
            - configMapRef:
                name: dynamiq-ai-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dynamiq-db-credentials
                  key: ai_app_database_url
            - name: CONSOLE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: CONSOLE_MASTER_KEY
            - name: HASH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: HASH_PEPPER
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: SSH_PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/dynamiq/keys
              readOnly: true
            - name: kb-storage
              mountPath: /data/kb-storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
      volumes:
        - name: jwt-keys
          secret:
            secretName: dynamiq-jwt-keys
        - name: kb-storage
          persistentVolumeClaim:
            claimName: kb-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-storage
  namespace: ai-hub-advws
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: ai-hub-advws
spec:
  selector:
    app: ai-runtime
  ports:
    - port: 8080
      targetPort: 8080
