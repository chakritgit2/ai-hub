# ai-runtime: /internal/v1/* (compile/publish, connection test/secret, KB indexing/search).
# Same image as ai-gateway, different command/port (deploy/docker/ai/Dockerfile's own TODO).
# KB *execution* via the compiler/agent run path is still a separate, larger deferred
# piece — this deployment only needs MinIO so indexing/search themselves are testable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: ai-hub-advws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-runtime
  template:
    metadata:
      labels:
        app: ai-runtime
    spec:
      imagePullSecrets:
        - name: dockersecret
      containers:
        - name: ai
          image: cr.advws.com/dynamiq-console/ai:TODO-tag
          # args, not command: the image's ENTRYPOINT (bin/start.sh) must still run so it
          # can bring up sshd before handing off to this uvicorn invocation (exec "$@").
          args: ["uv", "run", "uvicorn", "app.main_runtime:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
            # sshd (bin/start.sh) — SFTP access into the running pod, not exposed via Service.
            - name: sftp
              containerPort: 2222
          envFrom:
            - configMapRef:
                name: dynamiq-ai-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dynamiq-db-credentials
                  key: ai_app_database_url
            - name: CONSOLE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: CONSOLE_MASTER_KEY
            - name: HASH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: HASH_PEPPER
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: SSH_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dynamiq-minio-credentials
                  key: root_user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dynamiq-minio-credentials
                  key: root_password
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/dynamiq/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
      volumes:
        - name: jwt-keys
          secret:
            secretName: dynamiq-jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: ai-hub-advws
spec:
  selector:
    app: ai-runtime
  ports:
    - port: 8080
      targetPort: 8080
