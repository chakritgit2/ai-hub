# Single-replica MinIO — previously deferred (see deploy/k8s/HANDOFF.md's original "Known
# gaps": "ai-worker (KB indexing) and MinIO are not deployed ... out of scope for 'get chat
# working'"). Knowledge Bases' OKF file storage (ai/app/core/storage.py) needs it to be
# testable. ai-worker (the async indexing queue) remains deferred —
# ai/app/services/kb_indexer.py's index_kb_document is invoked synchronously today, not
# through ARQ, so no queue worker is required for this to work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: ai-hub-advws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamiq-minio
  template:
    metadata:
      labels:
        app: dynamiq-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: dynamiq-minio-credentials
                  key: root_user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-minio-credentials
                  key: root_password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: ai-hub-advws
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ai-hub-advws
spec:
  selector:
    app: dynamiq-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
