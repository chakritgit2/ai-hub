# console-api runs as php-fpm + an nginx sidecar in the same pod, sharing localhost
# (nginx fastcgi_passes to 127.0.0.1:9000) — same topology operations-advws already uses
# in this cluster. nginx.conf here mirrors deploy/docker/console-api/nginx.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-api-nginx-config
  namespace: ai-hub-advws
data:
  default.conf: |
    server {
        listen 8000;
        root /app/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-api
  namespace: ai-hub-advws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console-api
  template:
    metadata:
      labels:
        app: console-api
    spec:
      imagePullSecrets:
        - name: dockersecret
      containers:
        - name: console-api
          image: cr.advws.com/dynamiq-console/console-api:TODO-tag
          ports:
            # sshd (bin/start.sh) — SFTP access into the running pod for fast
            # edit-and-see-it-live iteration (kubectl port-forward), bypassing a
            # full commit/build/redeploy cycle. Not exposed via the Service/ingress.
            - name: sftp
              containerPort: 2222
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-console-secrets
                  key: SSH_PASSWORD
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ai_console
            - name: DB_SCHEMA
              value: console
            - name: DB_APP_USER
              value: console_app
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-db-credentials
                  key: console_app_password
            - name: DB_PLATFORM_USER
              value: console_platform
            - name: DB_PLATFORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dynamiq-db-credentials
                  key: console_platform_password
            # Temporary — SSO_* point at the in-cluster fake-sso service until real
            # Phalcon SSO integration exists (PRD §15 open question).
            - name: SSO_JWKS_URL
              value: http://fake-sso:8999/jwks.json
            - name: SSO_ISSUER
              value: https://sso.example.internal
            - name: SSO_AUDIENCE
              value: dynamiq-console
            - name: CONSOLE_JWT_PRIVATE_KEY_PATH
              value: /etc/dynamiq/keys/console-signing-key.pem
            - name: CONSOLE_JWT_KID
              value: console-2026-09
            - name: AI_RUNTIME_INTERNAL_BASE_URL
              value: http://ai-runtime:8080
            - name: AI_RUNTIME_PUBLIC_BASE_URL
              value: http://ai-runtime:8080
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/dynamiq/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: console-api-nginx-config
        - name: jwt-keys
          secret:
            secretName: dynamiq-jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: console-api
  namespace: ai-hub-advws
spec:
  selector:
    app: console-api
  ports:
    - port: 80
      targetPort: 8000
