# Local development only — NOT the production topology (see deploy/k8s for that, still a
# placeholder). Brings up the shared infra so console-api/ai/web can be run locally against
# something real. PRD-001 §5 (Postgres 16 + pgvector, Redis). Knowledge Bases' OKF files
# live on a plain local directory (app.core.storage, KB_STORAGE_ROOT) - no object-store
# service needed.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_console
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
