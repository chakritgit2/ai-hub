[project]
name = "dynamiq-ai-console-runtime"
version = "0.1.0"
description = "Dynamiq AI Management Console - ai-runtime / ai-gateway / ai-worker skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dynamiq==0.65.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1.0",
    "arq>=0.26,<1.0",
    "sse-starlette>=2.1,<3",
    "pyjwt>=2.9,<3",
    "cryptography>=46",
    "redis>=5.0,<6",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7",
    "minio>=7.2,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
